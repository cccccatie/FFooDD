<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>这一天在FDU吃了什么</title>
    <style>
        :root {
            --primary: #1E88E5;
            --primary-light: #64B5F6;
            --primary-dark: #1565C0;
            --bg: #F5F9FF;
            --card-bg: #FFFFFF;
            --text: #1E2A3A;
            --text-secondary: #6B7A8C;
            --border: #DDE6F0;
            --note-color: #FF3B30;
            --note-bg: #FFF0EE;
            --note-border: #FFD4D1;
            --shadow: 0 4px 20px rgba(30, 136, 229, 0.1);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px;
            overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }
        .top-bar {
            position: sticky; top: 0; z-index: 100; background: rgba(245, 249, 255, 0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
            padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .top-bar .logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: var(--primary); display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-bar .logo .icon { font-size: 24px; flex-shrink: 0; }
        .top-bar .actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        .icon-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--card-bg); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); transition: var(--transition); color: var(--text); user-select: none; }
        .icon-btn:active { transform: scale(0.9); }
        .calendar-container { max-width: 520px; margin: 0 auto; padding: 16px 16px 8px; }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
        .calendar-header .month-label { font-size: 19px; font-weight: 700; color: var(--primary-dark); }
        .calendar-header .nav-btns { display: flex; gap: 8px; }
        .calendar-header .nav-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--card-bg); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); transition: var(--transition); color: var(--text); }
        .calendar-header .nav-btn:active { transform: scale(0.88); }
        .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .calendar-weekdays span { padding: 6px 0; }
        .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day { aspect-ratio: 1; border-radius: 14px; border: none; background: transparent; cursor: pointer; font-size: 15px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s ease; position: relative; color: var(--text); user-select: none; gap: 3px; padding: 4px 2px; }
        .calendar-day:hover { background: #E3F2FD; }
        .calendar-day.other-month { color: #B0C4DE; opacity: 0.55; }
        .calendar-day.today { background: var(--primary); color: #fff; font-weight: 700; box-shadow: 0 4px 14px rgba(30, 136, 229, 0.35); }
        .calendar-day.today:hover { background: var(--primary-dark); }
        .calendar-day.selected { outline: 2.5px solid var(--primary); outline-offset: 1px; background: #E3F2FD; }
        .calendar-day.today.selected { outline-color: var(--primary-dark); }
        .calendar-day .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
        .calendar-day.today .dot { background: #fff; }
        .calendar-day .count-badge { position: absolute; top: 3px; right: 5px; font-size: 9px; font-weight: 700; color: var(--primary); background: #E3F2FD; border-radius: 8px; padding: 1px 5px; min-width: 16px; text-align: center; }
        .calendar-day.today .count-badge { background: rgba(255, 255, 255, 0.35); color: #fff; }
        .day-records { max-width: 520px; margin: 0 auto; padding: 8px 16px 20px; }
        .day-records .section-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; color: var(--primary-dark); }
        .record-card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); transition: var(--transition); position: relative; overflow: hidden; border: 1px solid #EBF0F8; }
        .record-card:active { transform: scale(0.98); }
        .record-card .food-name { font-size: 18px; font-weight: 800; margin-bottom: 6px; color: var(--text); }
        .record-card .photo { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 10px; background: #F5F9FF; }
        .record-card .tags-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #E3F2FD; color: var(--primary-dark); }
        .tag.tag-canteen { background: #E8F5E9; color: #2E7D32; }
        .tag.tag-meal { background: #E3F2FD; color: #1565C0; }
        .tag.tag-portion { background: #FFF3E0; color: #E65100; }
        .record-card .review-text { font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
        .record-card .note-box { background: var(--note-bg); border-left: 4px solid var(--note-color); padding: 10px 14px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 13px; line-height: 1.5; color: #B71C1C; margin-top: 8px; display: flex; align-items: flex-start; gap: 8px; font-weight: 500; }
        .record-card .note-box .note-icon { font-size: 16px; flex-shrink: 0; }
        .record-card .card-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; opacity: 0; transition: var(--transition); }
        .record-card:hover .card-actions, .record-card .card-actions:focus-within { opacity: 1; }
        .record-card .action-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255, 255, 255, 0.9); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); transition: var(--transition); color: #E53935; }
        .record-card .action-btn.edit-btn { color: var(--primary); }
        .record-card .action-btn:active { transform: scale(0.85); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-state .emoji { font-size: 56px; margin-bottom: 16px; }
        .empty-state .text { font-size: 15px; }
        .fab { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); width: 64px; height: 64px; border-radius: 50%; border: none; background: var(--primary); color: #fff; font-size: 32px; cursor: pointer; box-shadow: 0 6px 24px rgba(30, 136, 229, 0.45); transition: all 0.3s; display: flex; align-items: center; justify-content: center; z-index: 200; }
        .fab:active { transform: translateX(-50%) scale(0.88); background: var(--primary-dark); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 300; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); animation: fadeIn 0.2s; }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-sheet { background: var(--card-bg); border-radius: 24px 24px 0 0; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 20px 20px 30px; animation: slideUp 0.3s; }
        .modal-handle { width: 40px; height: 4px; border-radius: 4px; background: #D0DCEB; margin: 0 auto 16px; }
        .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 18px; text-align: center; color: var(--primary-dark); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; }
        .form-group label .optional { color: #B0A49A; font-weight: 500; text-transform: none; font-size: 11px; }
        .form-input { width: 100%; padding: 12px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); font-size: 15px; outline: none; transition: var(--transition); background: #FFFDFB; color: var(--text); font-family: inherit; resize: vertical; min-height: 44px; }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.12); }
        textarea.form-input { min-height: 70px; }
        .tag-selector { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-option { padding: 8px 16px; border-radius: 22px; border: 1.5px solid var(--border); background: #FFFDFB; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; user-select: none; color: var(--text-secondary); white-space: nowrap; }
        .tag-option:active { transform: scale(0.94); }
        .tag-option.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
        .tag-option.tag-canteen.selected { background: #2E7D32; border-color: #2E7D32; }
        .tag-option.tag-meal.selected { background: #1565C0; border-color: #1565C0; }
        .tag-option.tag-portion.selected { background: #E65100; border-color: #E65100; }
        .custom-input-row { display: flex; gap: 8px; margin-top: 8px; }
        .custom-input-row .form-input { flex: 1; min-height: 38px; padding: 8px 12px; font-size: 13px; }
        .custom-input-row .add-btn { padding: 8px 16px; border-radius: 20px; border: none; background: var(--primary-light); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; transition: var(--transition); white-space: nowrap; }
        .custom-input-row .add-btn:active { background: var(--primary-dark); transform: scale(0.95); }
        .note-input-wrap { position: relative; }
        .note-input-wrap .form-input { border-color: var(--note-border); background: var(--note-bg); color: #8B1A1A; font-weight: 500; padding-right: 40px; }
        .note-input-wrap .form-input::placeholder { color: #C89494; font-weight: 400; }
        .note-input-wrap .note-emoji { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 20px; pointer-events: none; }
        .note-input-wrap .form-input:focus { border-color: var(--note-color); box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.15); }
        .photo-upload { border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 20px; text-align: center; cursor: pointer; transition: var(--transition); background: #FFFDFB; position: relative; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
        .photo-upload:active { border-color: var(--primary); background: #F5F9FF; }
        .photo-upload .upload-icon { font-size: 32px; opacity: 0.6; }
        .photo-upload .upload-text { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .photo-upload img.preview { max-width: 100%; max-height: 200px; border-radius: 8px; object-fit: contain; }
        .photo-upload .remove-photo { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(0, 0, 0, 0.55); color: #fff; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .photo-upload .remove-photo:active { transform: scale(0.85); }
        .submit-btn { width: 100%; padding: 16px; border-radius: var(--radius-sm); border: none; background: var(--primary); color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; transition: var(--transition); margin-top: 8px; }
        .submit-btn:active { background: var(--primary-dark); transform: scale(0.97); }
        .search-panel { max-width: 520px; margin: 0 auto; padding: 16px 16px 20px; }
        .search-panel .search-input { width: 100%; padding: 14px 18px; border-radius: 28px; border: 2px solid var(--border); font-size: 15px; outline: none; transition: var(--transition); background: var(--card-bg); box-shadow: var(--shadow); color: var(--text); }
        .search-panel .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.12); }
        .search-panel .filter-section { margin-top: 16px; }
        .search-panel .filter-section .filter-label { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; }
        .search-panel .filter-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .filter-tag { padding: 7px 14px; border-radius: 18px; border: 1.5px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; user-select: none; color: var(--text-secondary); }
        .filter-tag:active { transform: scale(0.93); }
        .filter-tag.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .filter-tag.filter-canteen.active { background: #2E7D32; border-color: #2E7D32; }
        .filter-tag.filter-meal.active { background: #1565C0; border-color: #1565C0; }
        .filter-tag.filter-portion.active { background: #E65100; border-color: #E65100; }
        .filter-tag.filter-note.active { background: var(--note-color); border-color: var(--note-color); }
        .search-results-count { font-size: 13px; color: var(--text-secondary); margin-top: 14px; }
        .clear-search { text-align: center; margin-top: 16px; }
        .clear-search button { padding: 10px 24px; border-radius: 22px; border: 1.5px solid var(--border); background: transparent; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary); transition: var(--transition); }
        .clear-search button:active { background: #E3F2FD; transform: scale(0.95); }
        .toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1E2A3A; color: #fff; padding: 12px 22px; border-radius: 24px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); opacity: 0; pointer-events: none; transition: all 0.35s; z-index: 500; white-space: nowrap; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        @media (min-width: 600px) { .calendar-container { padding: 24px 20px 8px; } .day-records { padding: 12px 20px 24px; } .record-card { padding: 20px; } .modal-sheet { border-radius: 24px; margin-bottom: 20px; max-height: 80vh; } .modal-overlay { align-items: center; padding: 20px; } }
        @media (max-width: 380px) { .top-bar .logo { font-size: 16px; } .record-card .card-actions { opacity: 1; } .record-card .action-btn { width: 30px; height: 30px; font-size: 14px; } }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo"><span class="icon">🍜</span> 这一天在FDU吃了什么</div>
        <div class="actions"><button class="icon-btn" id="btnSearch" title="搜索">🔍</button></div>
    </header>

    <div class="calendar-container" id="calendarSection">
        <div class="calendar-header">
            <button class="nav-btn" id="btnPrevMonth">◀</button>
            <span class="month-label" id="monthLabel"></span>
            <button class="nav-btn" id="btnNextMonth">▶</button>
        </div>
        <div class="calendar-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="calendar-days" id="calendarDays"></div>
    </div>

    <div class="day-records" id="dayRecordsSection">
        <div class="section-title" id="recordsTitle"></div>
        <div id="recordsList"></div>
    </div>

    <div class="search-panel" id="searchPanel" style="display:none;">
        <input type="text" class="search-input" id="searchKeyword" placeholder="🔍 搜索食物名称、评价、食堂..." autocomplete="off">
        <div class="filter-section"><div class="filter-label">🏫 食堂名称</div><div class="filter-tags" id="filterCanteens"></div></div>
        <div class="filter-section"><div class="filter-label">🍽️ 用餐类型</div><div class="filter-tags" id="filterMealTypes"></div></div>
        <div class="filter-section"><div class="filter-label">⚖️ 分量</div><div class="filter-tags" id="filterPortions"></div></div>
        <div class="filter-section"><div class="filter-label">⚠️ 有注意标记</div><div class="filter-tags" id="filterHasNote"><button class="filter-tag filter-note" data-value="has_note">仅看有⚠️的记录</button></div></div>
        <div class="search-results-count" id="searchCount"></div>
        <div id="searchResults"></div>
        <div class="clear-search"><button id="btnClearSearch">✕ 清除所有筛选</button></div>
        <div style="text-align:center;margin-top:12px;"><button class="icon-btn" id="btnBackToCalendar" style="width:auto;padding:10px 24px;border-radius:22px;font-size:14px;font-weight:600;">← 返回日历</button></div>
    </div>

    <button class="fab" id="fabAdd"><span class="fab-icon">+</span></button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-title" id="modalTitle">🍽️ 记录今天的美味</div>
            <div class="form-group"><label>🍛 食物名称</label><input type="text" class="form-input" id="foodNameInput" placeholder="例如：红烧肉、珍珠奶茶..."></div>
            <div class="form-group"><label>📸 照片</label><div class="photo-upload" id="photoUpload"><span class="upload-icon" id="uploadIcon">📷</span><span class="upload-text" id="uploadText">点击上传照片</span><img class="preview" id="photoPreview" style="display:none;"><button class="remove-photo" id="btnRemovePhoto" style="display:none;">✕</button><input type="file" id="fileInput" accept="image/*" style="display:none;"></div></div>
            <div class="form-group"><label>🏫 食堂名称</label><div class="tag-selector" id="canteenSelector"></div><div class="custom-input-row" id="customCanteenRow" style="display:none;"><input type="text" class="form-input" id="customCanteenInput" placeholder="新食堂名称..."><button class="add-btn" id="btnAddCustomCanteen">添加</button></div></div>
            <div class="form-group"><label>🍽️ 用餐类型</label><div class="tag-selector" id="mealTypeSelector"></div><div class="custom-input-row" id="customMealRow" style="display:none;"><input type="text" class="form-input" id="customMealInput" placeholder="新用餐类型..."><button class="add-btn" id="btnAddCustomMeal">添加</button></div></div>
            <div class="form-group"><label>⚖️ 分量 <span class="optional">(选填)</span></label><div class="tag-selector" id="portionSelector"></div></div>
            <div class="form-group"><label>💬 我的评价</label><textarea class="form-input" id="reviewInput" rows="3" placeholder="这家店的红烧肉肥而不腻..."></textarea></div>
            <div class="form-group"><label>⚠️ 注意 <span class="optional">(选填)</span></label><div class="note-input-wrap"><input type="text" class="form-input" id="noteInput" placeholder="排队超长！微辣！"><span class="note-emoji">⚠️</span></div></div>
            <button class="submit-btn" id="btnSubmit">保存记录 ✓</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const STORAGE_KEY = 'fdu_eat_diary_v1';
            const CUSTOM_CANTEENS_KEY = 'fdu_eat_diary_canteens_v1';
            const CUSTOM_MEALS_KEY = 'fdu_eat_diary_meals_v1';
            const DEFAULT_CANTEENS = ['北食', '南食', '旦苑', '其他'];
            const DEFAULT_MEAL_TYPES = ['早饭', '正餐', '饮料', '甜点'];
            const DEFAULT_PORTIONS = ['量少', '正好', '量多'];
            let allData = {};
            let customCanteens = [];
            let customMealTypes = [];
            let currentYear = new Date().getFullYear();
            let currentMonth = new Date().getMonth();
            let selectedDate = formatDate(new Date());
            let isSearchMode = false;
            let selectedCanteen = null;
            let selectedMealType = null;
            let selectedPortion = null;
            let photoDataUrl = null;
            let editingRecordId = null;
            let editingDate = null;
            let activeSearchFilters = { canteen: null, mealType: null, portion: null, hasNote: false, keyword: '' };

            function formatDate(date) { const y = date.getFullYear(); const m = String(date.getMonth() + 1).padStart(2, '0'); const d = String(date.getDate()).padStart(2, '0'); return `${y}-${m}-${d}`; }
            function getTodayStr() { return formatDate(new Date()); }
            function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }

            function loadData() {
                try { const raw = localStorage.getItem(STORAGE_KEY); allData = raw ? JSON.parse(raw) : {}; } catch (e) { allData = {}; }
                try { const rawC = localStorage.getItem(CUSTOM_CANTEENS_KEY); customCanteens = rawC ? JSON.parse(rawC) : []; } catch (e) { customCanteens = []; }
                try { const rawM = localStorage.getItem(CUSTOM_MEALS_KEY); customMealTypes = rawM ? JSON.parse(rawM) : []; } catch (e) { customMealTypes = []; }
            }

            function saveData() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); } catch (e) { showToast('⚠️ 存储空间不足'); }
                try { localStorage.setItem(CUSTOM_CANTEENS_KEY, JSON.stringify(customCanteens)); } catch (e) {}
                try { localStorage.setItem(CUSTOM_MEALS_KEY, JSON.stringify(customMealTypes)); } catch (e) {}
            }

            function getAllCanteens() { return [...new Set([...DEFAULT_CANTEENS, ...customCanteens])]; }
            function getAllMealTypes() { return [...new Set([...DEFAULT_MEAL_TYPES, ...customMealTypes])]; }
            function getRecordsForDate(dateStr) { return allData[dateStr] || []; }
            function getTotalRecordsCount(dateStr) { return getRecordsForDate(dateStr).length; }

            function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._timeout); t._timeout = setTimeout(() => t.classList.remove('show'), 2200); }

            function compressImage(file, callback) {
                const reader = new FileReader();
                reader.onload = function(e) { const img = new Image(); img.onload = function() { const canvas = document.createElement('canvas'); let w = img.width, h = img.height; const maxW = 800, maxH = 800; if (w > maxW || h > maxH) { const ratio = Math.min(maxW / w, maxH / h); w = Math.round(w * ratio); h = Math.round(h * ratio); } canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h); callback(canvas.toDataURL('image/jpeg', 0.62)); }; img.src = e.target.result; };
                reader.readAsDataURL(file);
            }

            function renderCalendar() {
                document.getElementById('monthLabel').textContent = `${currentYear}年${currentMonth + 1}月`;
                const daysContainer = document.getElementById('calendarDays');
                daysContainer.innerHTML = '';
                const firstDay = new Date(currentYear, currentMonth, 1);
                const startWeekday = firstDay.getDay();
                const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();
                const todayStr = getTodayStr();
                const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
                for (let i = 0; i < totalCells; i++) {
                    const dayNum = i - startWeekday + 1;
                    let displayDay, dateObj, isOtherMonth = false;
                    if (dayNum <= 0) { displayDay = daysInPrevMonth + dayNum; dateObj = new Date(currentYear, currentMonth - 1, displayDay); isOtherMonth = true; }
                    else if (dayNum > daysInMonth) { displayDay = dayNum - daysInMonth; dateObj = new Date(currentYear, currentMonth + 1, displayDay); isOtherMonth = true; }
                    else { displayDay = dayNum; dateObj = new Date(currentYear, currentMonth, displayDay); }
                    const dateStr = formatDate(dateObj);
                    const isToday = dateStr === todayStr;
                    const isSelected = dateStr === selectedDate;
                    const count = getTotalRecordsCount(dateStr);
                    const btn = document.createElement('button');
                    btn.className = 'calendar-day'; if (isOtherMonth) btn.classList.add('other-month'); if (isToday) btn.classList.add('today'); if (isSelected) btn.classList.add('selected');
                    btn.setAttribute('data-date', dateStr);
                    btn.innerHTML = `<span>${displayDay}</span>${count > 0 ? '<span class="dot"></span>' : ''}${count > 1 ? `<span class="count-badge">${count}</span>` : ''}`;
                    btn.addEventListener('click', function() { selectedDate = dateStr; if (isOtherMonth) { if (dayNum <= 0) { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } } else { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } } } renderCalendar(); renderDayRecords(); showCalendarSection(); });
                    daysContainer.appendChild(btn);
                }
            }
